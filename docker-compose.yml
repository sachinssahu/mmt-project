# docker-compose.yml Runs Postgres in a container so I don't install it on my laptop.
# Start: docker compose up -d 
# Stop: docker compose down 
# Wipe data: docker compose down -v
# Check what's running: docker ps
# Quick check if postgres is alive | docker compose exec mmt_project psql -U postgres -d mmt_bus -c "\dt"



services:
  mmt_project:
    container_name: mmt_db #default name folder-service-number
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mmt_bus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:




# Q: Why Docker instead of installing Postgres normally?
# A: sealed box. delete and recreate in seconds, laptop untouched.
#    also this file lives in my repo, so anyone cloning gets the exact same database. no "works on my machine".
#
# Q: Why Postgres and not MySQL?
# A: requirement said database is a must, so schema is what gets judged.
#    my hard problem is 2 people booking same seat. Postgres is strong at transactions, locking, constraints.
#    also most common in Node backends, good for portfolio.

#services:  # list of containers I want to run. I have 1. Could add redis later.
#  db:  # my nickname for this container. Used as: docker compose exec db ...
#    container_name: mmt_bus_db  # default name is folder-service-number, ugly
#    image: postgres:16  # prebuilt package to download. 16 = version. Always pin it, else "latest" changes silently
#
#    restart: always  # if it crashes or I reboot my laptop, Docker starts it again automatically
#      # Q: why do I need this?
#      # A: without it, container stays dead after reboot. Monday morning my app can't connect
#      #    and I waste 20 min confused. It's not restarting constantly, only restarting IF it stopped.
#
#    environment:  # settings passed to Postgres on FIRST START ONLY
#      POSTGRES_USER: postgres  # creates this db user
#      POSTGRES_PASSWORD: postgres  # its password. fine locally, never in production
#      POSTGRES_DB: mmt_bus  # creates empty database with this name
#      # "first start only" matters: changing these later does nothing, data already exists
#      # to actually reset: docker compose down -v
#      # org uses POSTGRES_MULTIPLE_DATABASES (core_dev, payments_dev...) because separate services + test dbs.
#      # that is NOT a real Postgres setting, works only via their custom init script. I need one db only.
#
#    ports:
#      - "5433:5432"  # format = myLaptopPort:portInsideContainer
#      # container is sealed by default, this drills a hole so my app can reach it
#      #
#      # Q: why 5432, why is it standard?
#      # A: no deep reason. Postgres picked it in the 90s and it stuck. same as MySQL 3306, Redis 6379, HTTP 80.
#      #    a port is just a door number on my machine (65535 of them). any free port works, 5432 is only the default.
#      #
#      # Q: why did I change to 5433?
#      # A: rule is ONE PROGRAM PER PORT. org's Postgres container already holds 5432.
#      #    got: "Bind for 0.0.0.0:5432 failed: port is already allocated"
#      #    so I knock on a different outside door. right side stays 5432, inside the container
#      #    Postgres always listens there and doesn't know or care what the outside number is.
#      #    => my .env must say DB_PORT=5433
#
#    volumes:
#      - pgdata:/var/lib/postgresql/data  # format = storageName:pathInsideContainer
#      #
#      # Q: why do I need this line at all?
#      # A: containers are disposable. destroy one and everything inside is gone.
#      #    /var/lib/postgresql/data is where Postgres keeps its actual data files.
#      #    this says "keep that folder OUTSIDE the container so it survives".
#      #    without it: every restart = empty database, all buses/seats/bookings gone, reseed every time.
#      #
#      # Q: why does org's look different? (../database/pgdata:/var/lib/postgresql/data)
#      # A: two kinds of volume.
#      #    no dot/slash at start (mine)  = NAMED VOLUME. Docker manages storage, I never see the folder. simpler.
#      #    starts with ../ or ./ (theirs) = BIND MOUNT. a real folder in their repo, they can open and inspect it.
#      #    both keep data safe.
#      #
#      # Q: what are their other 3 volume lines?
#      # A: - ../database/init:/docker-entrypoint-initdb.d/
#      #      Postgres auto-runs any .sql file in that folder on FIRST start. that's how they create their many dbs.
#      #    - the scripts/ and data/ ones just share files into the container to run manually.
#      #    I don't need these. My seed data comes from a TypeScript seed script instead,
#      #    which is better because it uses my entities and can't drift out of sync with my schema.
#
#volumes:  # declares the storage so Docker creates and manages it
#  pgdata:  # block above USES it, this one DEFINES it